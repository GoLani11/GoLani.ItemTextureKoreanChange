[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "golani-texture-localizer"
version = "3.0.0a1"
description = "품목별 SPT 텍스처 한글화 작업 도구"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "UnityPy==1.25.0",
  "ispc_texcomp==1.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ocr = [
  "paddleocr==3.5.0",
  "paddlepaddle==3.2.0",
  "easyocr==1.7.2",
]

[project.scripts]
golani-localize = "golani_texture_localizer.cli:main"

[tool.setuptools]
package-dir = {"" = "localizer"}

[tool.setuptools.packages.find]
where = ["localizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "localizer"]
addopts = "-q"
markers = ["game_assets: opt-in read-only checks using local SPT assets"]
